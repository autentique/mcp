name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          package-manager-cache: false

      - run: node --version
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm publish
